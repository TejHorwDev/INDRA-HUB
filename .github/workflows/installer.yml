name: Build custom installer

# Deliberately separate from the release workflow.
#
# The custom installer wraps the stock one, and that wrapper has never been run
# on Windows. Until it has been installed, uninstalled and reinstalled once by a
# person, it must not be able to replace the download everyone else gets. This
# workflow produces it as an artifact; `release.yml` keeps shipping the proven
# installer until someone flips that switch on purpose.
#
#   • push a branch called `installer`  → builds and uploads the artifact
#   • "Run workflow"                    → the same, by hand

on:
  push:
    branches:
      - installer
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    name: Custom installer
    runs-on: windows-latest
    timeout-minutes: 30
    # The app lives in apps/desktop; the paths an action reads are written from
    # the repository root.
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Read the version being wrapped
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install the app's dependencies
        run: npm ci

      - name: Compile the app
        run: npm run build

      # The payload inside the custom installer is the installer that already
      # works: shortcuts, uninstall entry, per-user and per-machine folders and
      # the updater are all NSIS's, not ours.
      - name: Package the stock installer
        run: npx electron-builder --win --publish never

      - name: Put that installer inside the custom one
        shell: bash
        run: |
          mkdir -p installer/payload
          cp "release/INDRA-HUB-Setup-${{ steps.version.outputs.value }}.exe" installer/payload/inder-setup.exe
          ls -l installer/payload

      - name: Match the window's version to the app's
        run: npm pkg set "version=${{ steps.version.outputs.value }}" --prefix installer

      - name: Install the installer's own dependencies
        working-directory: apps/desktop/installer
        run: npm install --no-audit --no-fund

      - name: Build the custom installer
        working-directory: apps/desktop/installer
        run: npx electron-builder --win --publish never

      - name: Keep the artifact
        uses: actions/upload-artifact@v4
        with:
          name: INDRA-HUB-Setup-custom-${{ steps.version.outputs.value }}
          path: apps/desktop/installer/dist/*.exe
          if-no-files-found: error
          retention-days: 14

      # Where the file goes, and why it is not simply "a new latest release".
      #
      # releases/latest is where the app's updater reads payload.json from, so a
      # wrapper-only release must never become latest: it has no payload and would
      # break updating for everyone. Two safe destinations instead:
      #
      #   - if the stock release for this version exists, the window is attached
      #     to it, replacing the previous one. That is the page people visit, and
      #     the updater ignores this file.
      #   - otherwise it goes to the custom-installer pre-release, which can be
      #     replaced freely and never claims latest.
      - name: Publish the window where people will find it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          tag="v$version"
          file=$(ls installer/dist/*.exe | head -n 1)
          echo "Publishing $file"

          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Attaching to $tag"
            gh release upload "$tag" "$file" --clobber
            gh release view "$tag" --json assets --jq '.assets[] | [.name, .size] | @tsv'
            exit 0
          fi

          echo "No $tag release yet; using the pre-release"
          if ! gh release view custom-installer > /dev/null 2>&1; then
            gh release create custom-installer --prerelease --title "INDRA HUB — custom installer (test build)" --notes "The custom install window, wrapping the current stock installer. This is a test build: releases/latest still serves the proven installer, and the app's updater keeps reading its payload from there."
          fi
          gh release upload custom-installer "$file" --clobber
