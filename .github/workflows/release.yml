name: Build Windows release

# Two ways to start it:
#   • push a tag like v1.0.1  → builds and publishes a GitHub Release
#   • "Run workflow"          → builds and leaves the installer as a downloadable artifact
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# The release step needs to create a Release and upload the installer to it.
permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refuse to ship a release that does not compile
        run: npm run typecheck

      - name: Compile main, preload and renderer
        run: npm run build

      - name: Package the Windows installer
        run: npx electron-builder --win --publish never

      # The in-app update. One small archive of the compiled app plus a manifest
      # that names it, its size and its SHA-256. An installed copy downloads
      # these instead of the 120 MB installer, so updating costs seconds and
      # never runs an installer again.
      - name: Pack the in-app update payload
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if (-not $version) { $version = (Get-Content package.json | ConvertFrom-Json).version }

          # The archive root must mirror the app directory: main/, preload/,
          # renderer/. The bootstrap loads <payload>/main/index.js, and getting
          # this wrong would make every update silently fail to apply — so it is
          # asserted below rather than discovered by a user.
          New-Item -ItemType Directory -Force -Path payload | Out-Null
          Copy-Item -Path out/* -Destination payload -Recurse

          $asar = "release/INDRA-HUB-Payload-$version.asar"
          npx --no-install asar pack payload $asar
          if (!(Test-Path $asar)) { throw "The update payload was not produced" }

          $listing = (npx --no-install asar list $asar) -join "`n"
          if ($listing -notmatch 'main[\\/]index\.js') {
            throw "The update payload does not contain main/index.js — the bootstrap could not load it"
          }
          if ($listing -notmatch 'renderer[\\/]index\.html') {
            throw "The update payload does not contain renderer/index.html"
          }

          $file = "INDRA-HUB-Payload-$version.asar"
          $hash = (Get-FileHash "release/$file" -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item "release/$file").Length
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$file"

          [ordered]@{
            version = $version
            file    = $file
            sha256  = $hash
            size    = $size
            url     = $url
          } | ConvertTo-Json -Compress | Set-Content -NoNewline "release/payload.json"

          Get-Content "release/payload.json"
          Get-ChildItem release | Select-Object Name, Length

      - name: Show what was produced
        run: |
          Get-ChildItem release | Select-Object Name, Length
        shell: pwsh

      # A release without these two files installs fine but can never update
      # itself, so fail the build instead of shipping a silent dead end.
      - name: Confirm the update feed is wired into the build
        run: |
          if (!(Test-Path "release/win-unpacked/resources/app-update.yml")) {
            throw "app-update.yml is missing — self-update would be dead on arrival"
          }
          if (!(Test-Path "release/latest.yml")) {
            throw "latest.yml is missing — installed copies could not see this release"
          }
          Get-Content "release/win-unpacked/resources/app-update.yml"
          Get-Content "release/latest.yml"
        shell: pwsh

      # Tag pushes become a real Release with the installer attached.
      - name: Publish the Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # latest.yml is what installed copies read to notice a newer version;
          # the blockmaps make the download incremental. Without them the
          # installer works but nothing can update itself.
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
            release/INDRA-HUB-Payload-*.asar
            release/payload.json
          generate_release_notes: true
          fail_on_unmatched_files: true

      # Manual runs still give a downloadable installer, attached to the run.
      - name: Upload the installer as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: indra-hub-windows
          path: |
            release/*.exe
            release/*.yml
            release/INDRA-HUB-Payload-*.asar
            release/payload.json
          if-no-files-found: error
