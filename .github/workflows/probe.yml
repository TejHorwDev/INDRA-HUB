name: probe

# Temporary: asks the live API what it is actually answering for artwork, with the status
# line and the body — which a 500 hides from the browser and which the run log cannot hand
# back here. The report is committed to the branch it ran on instead.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch artwork and report
        run: |
          set +e
          : > probe-report.txt
          for url in \
            "https://indra-loader-api.onrender.com/api/health" \
            "https://indra-loader-api.onrender.com/api/files/images/mwhh0otf-b59wjd-marimosc00k_pindown.io_1794725025.webm" \
            "https://indra-loader-api.onrender.com/api/files/images/mwginv5q-1kk0df-Cyberpunk-Bypass-Software-Box.png" \
            "https://indra-loader-api.onrender.com/api/files/exes/mwhcg6dy-l3g7xa-IndraMenu.exe" ; do
            {
              echo "======= $url"
              curl -sS -o /tmp/body.bin -D /tmp/head.txt --max-time 90 \
                -w "status=%{http_code} bytes=%{size_download} type=%{content_type}\n" "$url"
              echo "--- response headers"
              tr -d '\r' < /tmp/head.txt | grep -iE '^(HTTP/|content-|cache-control|x-)' || true
              echo "--- body (first 800 printable bytes)"
              head -c 800 /tmp/body.bin | tr -cd '[:print:]\n' | head -c 800
              echo
              echo
            } >> probe-report.txt
          done

      - name: Commit the report
        run: |
          git config user.name "probe"
          git config user.email "probe@users.noreply.github.com"
          git add -f probe-report.txt
          git commit -m "probe: live files report" || true
          git push
