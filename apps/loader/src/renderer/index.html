<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The Content-Security-Policy is sent as a response header by the main
      process (see src/main/index.ts), not written here. A header cannot be
      bypassed by markup that arrives later, and a meta tag would also block the
      inline preamble a development server needs to hot-reload the page.
    -->
    <title>INDRA LOADER</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
