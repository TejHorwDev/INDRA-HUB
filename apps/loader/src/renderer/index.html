<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      No remote code, no inline script. Images and fonts are local; the only
      network the renderer may reach is nothing at all — every request the app
      makes happens in the main process.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'"
    />
    <title>INDRA LOADER</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
