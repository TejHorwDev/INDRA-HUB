appId: com.indra.hub
productName: INDRA HUB
copyright: Copyright © 2026 TejHorwDev

# Installers are build artifacts, never committed.
directories:
  output: release
  buildResources: build

# Only the compiled app travels inside the installer — no sources, no tooling.
files:
  - out/**/*
  - '!**/*.map'

asar: true

# Where the updater looks for new versions. electron-builder turns this into
# app-update.yml inside the installed app, and writes latest.yml next to the
# installer so the running copy can compare versions.
publish:
  provider: github
  owner: TejHorwDev
  repo: INDRA-HUB
  releaseType: release

# One download only: the installer. A portable build was shipped before, but
# two files confuse people and a portable copy can never update itself, so the
# installer is the single way in.
win:
  # The mark, everywhere Windows shows one: the app's own window, taskbar,
  # desktop shortcut, Add/Remove programs, and the Setup file itself. Without
  # this an installed copy carries Electron's icon, which is the single most
  # obvious sign of a stock build.
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  # A real wizard, not a silent one-click blob: the user picks the folder and
  # can find the install again from Add/Remove programs.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: INDRA HUB
  # Uninstalling must never destroy the user's projects, accounts or keys.
  deleteAppDataOnUninstall: false
  artifactName: INDRA-HUB-Setup-${version}.${ext}

  # The wizard, branded. Generated by scripts/make-installer-art.py; the sizes
  # are fixed by NSIS (sidebar 164x314, header 150x57) and the .ico carries every
  # size Windows asks for, down to 16px.
  # Names resolve inside `build/` (buildResources), which is where the
  # generator writes them — a "build/" prefix here would look for build/build/.
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
  installerHeaderIcon: installerHeader.ico
  installerSidebar: installerSidebar.bmp
  uninstallerSidebar: uninstallerSidebar.bmp
  installerHeader: installerHeader.bmp
  include: installer.nsh
